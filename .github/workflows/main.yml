name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
      - name: Build
        run: go build -v ./...
      - name: Test
        env:
          TEST_LOGIN: ${{ secrets.TEST_LOGIN }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_LOGIN_SECOND: ${{ secrets.TEST_LOGIN_SECOND }}
          TEST_PASSWORD_SECOND: ${{ secrets.TEST_PASSWORD_SECOND }}
          DEBUG: "false"
          API_URL: https://testboard.avito.com/api/v1
        run: go test -v ./...
